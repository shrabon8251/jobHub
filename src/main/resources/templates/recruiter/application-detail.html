<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Candidate review')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('recruiter', 'applicants', 'Candidate review')}"></div>
    <main class="app-main">
        <div class="app-content"><div th:replace="~{fragments/ui :: flash}"></div><p><a class="text-link" th:href="@{/recruiter/applications}">Back to applicants</a></p><div class="page-heading"><div><span class="eyebrow" th:text="${applicationRecord.job.title}">Job</span><h1 th:text="${applicationRecord.jobSeeker.fullName}">Candidate</h1><p th:text="|Applied ${#temporals.format(applicationRecord.appliedAt, 'dd MMM yyyy')}|">Applied date</p></div><span th:replace="~{fragments/ui :: status(${applicationRecord.status})}"></span></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Candidate note</h2></div><p th:text="${applicationRecord.coverLetter}">Cover letter</p><section th:if="${applicationRecord.jobSeeker.bio}"><h3>About the candidate</h3><p th:text="${applicationRecord.jobSeeker.bio}">Bio</p></section></section><aside class="action-card"><h3>Move the conversation forward</h3><p>Choose the next honest step in this candidate's journey.</p><form th:if="${applicationRecord.status.name() == 'APPLIED'}" th:action="@{/recruiter/applications/{id}/review(id=${applicationRecord.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--primary" type="submit">Move to reviewing</button></form><form th:if="${applicationRecord.status.name() == 'REVIEWING'}" th:action="@{/recruiter/applications/{id}/shortlist(id=${applicationRecord.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--primary" type="submit">Shortlist candidate</button></form><a class="button button--secondary" th:if="${applicationRecord.status.name() == 'SHORTLISTED'}" th:href="@{/recruiter/applications/{id}/interview(id=${applicationRecord.id})}">Schedule interview</a><a class="button button--secondary" th:if="${applicationRecord.interview != null}" th:href="@{/recruiter/interviews/{id}(id=${applicationRecord.interview.id})}">View interview</a><form th:if="${applicationRecord.status.name() == 'INTERVIEW'}" th:action="@{/recruiter/applications/{id}/select(id=${applicationRecord.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--primary" type="submit">Select candidate</button></form><form th:if="${applicationRecord.status.name() != 'SELECTED' and applicationRecord.status.name() != 'REJECTED'}" th:action="@{/recruiter/applications/{id}/reject(id=${applicationRecord.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--ghost" data-confirm="Reject this application?" type="submit">Reject application</button></form></aside></div></div></main></body>
</html>
