<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Interview details')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('recruiter', 'applicants', 'Interview details')}"></div>
    <main class="app-main"><div class="app-content narrow"><p><a class="text-link" th:href="@{/recruiter/applications/{id}(id=${interview.application.id})}">â† Back to candidate</a></p><div class="page-heading"><div><span class="eyebrow">Candidate conversation</span><h1>Interview</h1><p th:text="${interview.application.jobSeeker.fullName}">Candidate</p></div><span class="badge badge--interview">Interview</span></div><section class="interview-card"><div class="date-tile"><strong th:text="${interview.interviewDate.dayOfMonth}">12</strong><small th:text="${interview.interviewDate.month}">May</small></div><div><h3 th:text="${#temporals.format(interview.interviewDate, 'EEEE, dd MMMM yyyy')}">Date</h3><p th:text="${#temporals.format(interview.interviewTime, 'h:mm a')}">Time</p></div></section><section class="panel stack-gap"><div class="panel-head"><h2>Meeting details</h2><a class="button button--secondary button--small" th:href="@{/recruiter/interviews/{id}/edit(id=${interview.id})}">Reschedule</a></div><a class="button button--primary" th:if="${interview.meetingLink != null}" th:href="${interview.meetingLink}">Open meeting link â†—</a><p class="muted" th:if="${interview.meetingLink == null}">No meeting link has been added yet.</p><h3 th:if="${interview.notes}">Notes</h3><p th:if="${interview.notes}" th:text="${interview.notes}">Notes</p><form th:action="@{/recruiter/interviews/{id}/cancel(id=${interview.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--ghost" data-confirm="Cancel this interview?" type="submit">Cancel interview</button></form></section></div></main></body>
</html>
