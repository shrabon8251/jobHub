<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('My jobs')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('recruiter', 'jobs', 'My jobs')}"></div>
    <main class="app-main">
        <div class="app-content"><div th:replace="~{fragments/ui :: flash}"></div><div class="page-heading"><div><span class="eyebrow">Your opportunities</span><h1>My jobs</h1><p>Keep every role clear, current, and easy to manage.</p></div><a class="button button--primary" th:href="@{/recruiter/jobs/new}">Create a job <span aria-hidden="true">ï¼‹</span></a></div><form class="search-bar panel" method="get" th:action="@{/recruiter/jobs}"><div class="field"><label for="job-search">Search by title</label><input id="job-search" name="keyword" th:value="${keyword}" placeholder="e.g. Senior product designer"></div><div class="field"><label for="job-status">Status</label><select id="job-status" name="status"><option value="">All statuses</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == status}"></option></select></div><div class="form-actions form-actions--end"><button class="button button--secondary" type="submit">Filter</button></div></form><div class="table-wrap" th:if="${!jobs.empty}"><table class="data-table"><thead><tr><th>Role</th><th>Status</th><th>Deadline</th><th>Action</th></tr></thead><tbody><tr th:each="job : ${jobs.content}"><td><a th:href="@{/recruiter/jobs/{id}(id=${job.id})}" th:text="${job.title}">Job title</a><small class="table-subtext" th:text="${job.location}">Location</small></td><td><span th:replace="~{fragments/ui :: status(${job.status})}"></span></td><td th:text="${job.deadline}">date</td><td><a class="button button--ghost" th:href="@{/recruiter/jobs/{id}(id=${job.id})}">Manage</a></td></tr></tbody></table></div><div th:if="${jobs.empty}" th:replace="~{fragments/ui :: empty('â–¤', 'No jobs yet', 'Create your first opportunity and start a better hiring conversation.', '/recruiter/jobs/new', 'Create a job')}"></div><nav th:if="${jobs.totalPages > 1}" class="pagination" aria-label="Job pages"><a th:if="${jobs.hasPrevious()}" th:href="@{/recruiter/jobs(page=${jobs.number - 1},keyword=${keyword},status=${status})}">â† Previous</a><span th:text="|Page ${jobs.number + 1} of ${jobs.totalPages}|">Page</span><a th:if="${jobs.hasNext()}" th:href="@{/recruiter/jobs(page=${jobs.number + 1},keyword=${keyword},status=${status})}">Next â†’</a></nav></div></main></body>
</html>
