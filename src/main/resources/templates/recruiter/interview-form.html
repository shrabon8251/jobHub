<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Schedule interview')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('recruiter', 'applicants', 'Schedule interview')}"></div>
    <main class="app-main"><div class="app-content narrow">
    <p><a class="text-link" th:href="@{/recruiter/applications/{id}(id=${applicationId})}">Back to candidate</a></p>
    <div class="page-heading"><div><span class="eyebrow">Create a useful moment</span><h1 th:text="${interviewId == null ? 'Schedule interview' : 'Reschedule interview'}">Interview</h1><p>Give the candidate a clear time, place, and context.</p></div></div>
    <form class="panel form-stack" th:action="${interviewId == null} ? @{/recruiter/applications/{id}/interview(id=${applicationId})} : @{/recruiter/interviews/{id}(id=${interviewId})}" th:object="${interviewForm}" method="post">
        <input th:replace="~{fragments/ui :: csrf}">
        <div class="error-summary" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Please review the form.</p></div>
        <div class="form-grid"><div class="field"><label for="interview-date">Date</label><input id="interview-date" th:field="*{interviewDate}" type="date"><small class="field-error" th:errors="*{interviewDate}"></small></div><div class="field"><label for="interview-time">Time</label><input id="interview-time" th:field="*{interviewTime}" type="time"><small class="field-error" th:errors="*{interviewTime}"></small></div><div class="field field--wide"><label for="meeting-link">Meeting link</label><input id="meeting-link" th:field="*{meetingLink}" type="url" placeholder="https://"><small class="field-error" th:errors="*{meetingLink}"></small><small class="form-help">Use a stable link the candidate can access.</small></div><div class="field field--wide"><label for="interview-notes">Notes</label><textarea id="interview-notes" th:field="*{notes}" maxlength="4000" data-character-count="true" placeholder="What should the candidate prepare?"></textarea><small class="field-error" th:errors="*{notes}"></small><small class="form-help character-counter" data-character-counter aria-live="polite"></small></div></div>
        <div class="form-actions form-actions--end"><a class="button button--secondary" th:href="@{/recruiter/applications/{id}(id=${applicationId})}">Cancel</a><button class="button button--primary" type="submit" th:text="${interviewId == null ? 'Schedule interview' : 'Save changes'}">Save</button></div>
    </form>
</div></main>
</body>
</html>
