<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('User management')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('admin', 'users', 'User management')}"></div>
    <main class="app-main">
        <div class="app-content"><div th:replace="~{fragments/ui :: flash}"></div><div class="page-heading"><div><span class="eyebrow">Platform people</span><h1>User management</h1><p>Search the community and control account access responsibly.</p></div></div><form class="panel search-bar" method="get" th:action="@{/admin/users}"><div class="field"><label for="user-search">Name or email</label><input id="user-search" type="search" name="q" th:value="${q}" placeholder="Search users"></div><div class="field"><label for="user-role">Role</label><select id="user-role" name="role"><option value="">All roles</option><option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == selectedRole}"></option></select></div><div class="field"><label for="user-enabled">Account status</label><select id="user-enabled" name="enabled"><option value="">All statuses</option><option value="true" th:selected="${selectedEnabled == true}">Enabled</option><option value="false" th:selected="${selectedEnabled == false}">Disabled</option></select></div><div class="form-actions form-actions--end"><button class="button button--secondary" type="submit">Apply filters</button></div></form><div class="table-wrap" th:if="${users.totalElements > 0}"><table class="data-table"><caption class="sr-only">Registered HIRVO users</caption><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Joined</th><th>Action</th></tr></thead><tbody><tr th:each="user : ${users.content}"><td><strong th:text="${user.name}">Name</strong><small class="table-subtext" th:text="${user.email}">Email</small></td><td th:text="${user.role}">Role</td><td><span class="badge" th:classappend="${user.enabled ? ' badge--enabled' : ' badge--disabled'}" th:text="${user.enabled ? 'Enabled' : 'Disabled'}">Enabled</span></td><td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</td><td><form th:if="${user.enabled}" th:action="@{/admin/users/{id}/disable(id=${user.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--ghost" data-confirm="Disable this account? The user will not be able to sign in." type="submit">Disable</button></form><form th:unless="${user.enabled}" th:action="@{/admin/users/{id}/enable(id=${user.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--secondary button--small" type="submit">Enable</button></form></td></tr></tbody></table></div><div th:if="${users.totalElements == 0}" th:replace="~{fragments/ui :: empty('â—Ž', 'No users found', 'Try a different name, email, role, or account status.', '/admin/users', 'Clear filters')}"></div><nav th:if="${users.totalPages > 1}" class="pagination" aria-label="User pages"><a th:if="${users.hasPrevious()}" th:href="@{/admin/users(q=${q},role=${selectedRole},enabled=${selectedEnabled},page=${users.number - 1})}">â† Previous</a><span th:text="|Page ${users.number + 1} of ${users.totalPages}|">Page</span><a th:if="${users.hasNext()}" th:href="@{/admin/users(q=${q},role=${selectedRole},enabled=${selectedEnabled},page=${users.number + 1})}">Next â†’</a></nav></div></main></body>
</html>
