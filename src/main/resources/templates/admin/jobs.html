<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Job moderation')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('admin', 'jobs', 'Job moderation')}"></div>
    <main class="app-main">
        <div class="app-content"><div th:replace="~{fragments/ui :: flash}"></div><div class="page-heading"><div><span class="eyebrow">Platform safety</span><h1>Job moderation</h1><p>Inspect listings and act only when a job violates platform expectations.</p></div></div><form class="panel search-bar" method="get" th:action="@{/admin/jobs}"><div class="field"><label for="moderation-search">Search title, company, category, or location</label><input id="moderation-search" type="search" name="q" th:value="${q}" placeholder="Search listings"></div><div class="field"><label for="moderation-status">Status</label><select id="moderation-status" name="status"><option value="">All statuses</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == selectedStatus}"></option></select></div><div class="form-actions form-actions--end"><button class="button button--secondary" type="submit">Apply filters</button></div></form><div class="table-wrap" th:if="${jobs.totalElements > 0}"><table class="data-table"><caption class="sr-only">All job listings</caption><thead><tr><th>Listing</th><th>Recruiter</th><th>Category</th><th>Status</th><th>Deadline</th><th>Action</th></tr></thead><tbody><tr th:each="job : ${jobs.content}"><td><a th:href="@{/admin/jobs/{id}(id=${job.id})}" th:text="${job.title}">Job title</a><small class="table-subtext" th:text="${job.location}">Location</small></td><td th:text="${job.recruiter.companyName}">Company</td><td th:text="${job.category.name}">Category</td><td><span th:replace="~{fragments/ui :: status(${job.status})}"></span></td><td th:text="${job.deadline}">Date</td><td><a class="button button--ghost" th:href="@{/admin/jobs/{id}(id=${job.id})}">Inspect</a></td></tr></tbody></table></div><div th:if="${jobs.totalElements == 0}" th:replace="~{fragments/ui :: empty('â–¤', 'No listings found', 'Try a different search or status filter.', '/admin/jobs', 'Clear filters')}"></div><nav th:if="${jobs.totalPages > 1}" class="pagination" aria-label="Job pages"><a th:if="${jobs.hasPrevious()}" th:href="@{/admin/jobs(q=${q},status=${selectedStatus},page=${jobs.number - 1})}">â† Previous</a><span th:text="|Page ${jobs.number + 1} of ${jobs.totalPages}|">Page</span><a th:if="${jobs.hasNext()}" th:href="@{/admin/jobs(q=${q},status=${selectedStatus},page=${jobs.number + 1})}">Next â†’</a></nav></div></main></body>
</html>
