<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Categories')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('admin', 'categories', 'Categories')}"></div>
    <main class="app-main">
        <div class="app-content"><div th:replace="~{fragments/ui :: flash}"></div><div class="page-heading"><div><span class="eyebrow">Discovery structure</span><h1>Categories</h1><p>Keep the opportunity landscape clear and easy to explore.</p></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Create a category</h2><p>Use a concise name candidates will recognize.</p></div></div><form class="form-stack" th:action="@{/admin/categories}" th:object="${categoryForm}" method="post"><input th:replace="~{fragments/ui :: csrf}"><div class="field"><label for="category-name">Category name</label><input id="category-name" th:field="*{name}" maxlength="100" required placeholder="e.g. Product &amp; Design"><small class="field-error" th:errors="*{name}"></small></div><p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p><button class="button button--primary" type="submit">Create category</button></form></section><section class="panel"><div class="panel-head"><div><h2>Existing categories</h2><p>Categories with live job relationships cannot be removed.</p></div></div><div class="data-list" th:if="${!#lists.isEmpty(categories)}"><div class="data-list-item" th:each="category : ${categories}"><form class="category-edit-form" th:action="@{/admin/categories/{id}(id=${category.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><label class="sr-only" th:for="|category-${category.id}|">Category name</label><input class="control-input" th:id="|category-${category.id}|" name="name" th:value="${category.name}" maxlength="100" required><button class="button button--secondary button--small" type="submit">Save</button></form><form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post"><input th:replace="~{fragments/ui :: csrf}"><button class="button button--ghost" data-confirm="Delete this category if it has no job relationships?" type="submit">Delete</button></form></div></div><div th:if="${#lists.isEmpty(categories)}" th:replace="~{fragments/ui :: empty('âŒ˜', 'No categories yet', 'Create the first category to organize opportunities.', null, null)}"></div></section></div></div></main></body>
</html>
