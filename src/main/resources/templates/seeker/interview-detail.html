<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('Interview details')}"></head>
<body class="app-shell">
    <div th:replace="~{fragments/ui :: workspace-nav('seeker', 'applications', 'Interview details')}"></div>
    <main class="app-main"><div class="app-content narrow"><p><a class="text-link" th:href="@{/seeker/applications}">â† Back to applications</a></p><div class="page-heading"><div><span class="eyebrow">A moment worth preparing for</span><h1>Interview details</h1><p th:text="${interview.application.job.title}">Job title</p></div><span class="badge badge--interview">Interview</span></div><section class="interview-card"><div class="date-tile"><strong th:text="${interview.interviewDate.dayOfMonth}">12</strong><small th:text="${interview.interviewDate.month}">May</small></div><div><h3 th:text="${#temporals.format(interview.interviewDate, 'EEEE, dd MMMM yyyy')}">Date</h3><p th:text="${#temporals.format(interview.interviewTime, 'h:mm a')}">Time</p></div></section><section class="panel stack-gap"><div class="panel-head"><h2>Meeting information</h2></div><p class="muted" th:if="${interview.meetingLink == null}">Your recruiter has not added a meeting link yet.</p><a class="button button--primary" th:if="${interview.meetingLink != null}" th:href="${interview.meetingLink}">Join meeting <span aria-hidden="true">â†—</span></a><h3 th:if="${interview.notes != null and !#strings.isEmpty(interview.notes)}">Notes</h3><p th:if="${interview.notes != null and !#strings.isEmpty(interview.notes)}" th:text="${interview.notes}">Notes</p></section></div></main></body>
</html>
